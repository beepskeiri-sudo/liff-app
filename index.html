<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
 <!-- ◆ 内部にボタンを埋め込めるよう、spanタグで囲いました -->
  <div id="message"><span>処理中...</span></div>
  <style>
  #message {
    font-size: 56px;          /* 文字を大きく */
    font-weight: bold;        /* 太字 */
    color: #222;              /* 濃い文字色 */
    text-align: center;       /* 横中央 */

    display: flex;
    flex-direction: column;   /* ◆ メッセージと✕を縦に並べるために追加 */
    justify-content: center;  /* 横中央 */
    align-items: center;      /* 縦中央 */

    height: 100vh;            /* 画面全体の高さ */
    width: 100%;

    line-height: 1.5;
    padding: 20px;

    background-color: #f9f9f9; /* 背景色 */
    white-space: pre-line;     /* \n を改行として表示 */
    box-sizing: border-box;    /* ◆ パディングによる崩れ防止 */  
    }
    /* ◆ 追加した ✕ ボタン（テキスト風リンク）のスタイル */
    .close-trigger {
      display: inline-block;
      margin-top: 40px;
      font-size: 40px;
      color: #e03131;          /* 押しやすい赤色 */
      cursor: pointer;
      text-decoration: underline;
    }
   </style>

  <script>
　　// ========================================================== 
    // 二重送信防止 
    // ==========================================================
    let isProcessing = false;
    // ==========================================================
    // 今回のQR処理が完了したか
    // ==========================================================
    let isFinished = false;
    // ==========================================================
    // このLIFF起動がすでに処理済みか確認
    // ==========================================================
    let alreadyProcessed = false;

    // ==========================================================
    // URLから今回の処理を識別するキーを作る
    // ==========================================================
    const currentParams =
      new URLSearchParams(window.location.search);

    const currentAction =
      currentParams.get("action") || "";

    const currentGenbaCd =
      currentParams.get("genba") || "";

    const currentDate =
      currentParams.get("date") || "";


    const storageKey =
      "QR_STAMP_PROCESSED_" +
      currentAction + "_" +
      currentGenbaCd + "_" +
      currentDate;

    // ==========================================================
    // ★追加
    // sessionStorageに処理済み記録があるか確認
    // ==========================================================
    try {

      if (sessionStorage.getItem(storageKey) === "1") {

        alreadyProcessed = true;

        console.log(
          "この処理はすでに完了しています。"
        );

      }

    } catch (e) {

      console.error(
        "sessionStorage確認エラー:",
        e
      );

    }
    
    function log(msg) {
      document.getElementById("message").innerHTML = `<span>${msg}</span>`;
      console.log(msg);
    }
    // ◆ ボタンを押した時に実行される閉じる関数
    function closeWindow() {
      // ------------------------------------------
      // すでに処理完了していることを記録
      // ------------------------------------------
      isFinished = true;
      
      if (typeof liff !== 'undefined' && liff.isInClient()) {
        liff.closeWindow();
      } else {
        window.close();
      }
    }
    // ========================================================== 
    // 打刻処理 
    // ==========================================================
async function sendStamp() {
    // ========================================================
    // ★追加
    // すでに処理済みならGASを実行しない
    // ========================================================
      if (alreadyProcessed) {

        console.log(
          "処理済みのタスクなのでGASへ送信しません"
        );

        document.getElementById("message").innerHTML = `
          <span>この処理はすでに終了しています。</span>
          <div
            class="close-trigger"
            onclick="closeWindow()"
          >
            ✕ 閉じる
          </div>
        `;

        return;
      }
  
  
  // ========================================================
    // ① すでに処理開始済みなら何もしない
    // ========================================================
    if (isProcessing) { console.log("すでに処理中のため送信しません"); return; }
    // ========================================================
    // ② すでに処理完了している場合も何もしない
    // ========================================================
    if (isFinished) {

        console.log(
          "すでに処理完了しているため送信しません"
        );
       return;
    }
 
  // 処理開始 
    isProcessing = true;
try { 
// liffIdセット
//log("1: liff.init開始");
//log(window.location.href);
  try {
  //if (window.parent !== window) {
  // iframeの中にいる場合、親ウィンドウのURLを確認する処理
  // GASの場合は回避が難しいことが多いため、
  // 以下の設定で初期化を試みる
  //}    
  await liff.init({ liffId: "2009820268-v3E9yC4f", withLoginOnExternalBrowser: true 
    });
  //log("2: liff.init成功");
} catch (err) {
   console.error(err);

   // ----------------------------------------------
   // LIFF初期化失敗
   // この起動から再送信はさせない
   // ---------------------------------------------
    isFinished = true;
    document.getElementById("message").innerHTML =
            "<span>LIFFの初期化に失敗しました。</span>" +
            '<div class="close-trigger" onclick="closeWindow()">✕ 閉じる</div>';

    return;
}
    
  if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    // 修正ポイント2: パラメータをURLからではなくLIFFコンテキストから取る
    // (LINE内ブラウザで開いている場合、こちらの方が確実です)
  
//log("3: profile取得成功");
  
    const context = liff.getContext();
    console.log("LIFF context:", context);
    const profile = await liff.getProfile();
// URLパラメータ取得    
    const params = new URLSearchParams(window.location.search);
    const action = params.get("action");
    const genbaCd = params.get("genba");
    const date = params.get("date");

 //log(`4: データ取得成功 (action:${action})`);

    document.getElementById("message").innerHTML = "<span>送信中...</span>";
//log("5: fetch開始");

 // エンドポイントURLを変更
     const response = await fetch("https://script.google.com/macros/s/AKfycbyQqdkxzv88kkfp3dQntI1hWOZVhh8HxIBxIr9v9IP6jeMijmDC-1YgpuIBHokNgJ0/exec", 
      { method: "POST",
      body: JSON.stringify({
        genbaCd: genbaCd,
        date: date,
        action: action,
        userId: profile.userId,
        displayName: profile.displayName
      })
    }
 );
//log("6: fetch成功");

  // ====================================================== 
  // GASからの結果取得 
  // ======================================================
    const result = await response.json();
    const msgText = result.message || "完了しました";
  // ======================================================
  // ★★★ 最重要 ★★★
  //
  // GAS処理が正常終了したら
  // このLIFF起動を「処理済み」と記録
  // ======================================================
        try {

          sessionStorage.setItem(
            storageKey,
            "1"
          );

        } catch (e) {

          console.error(
            "処理済み記録エラー:",
            e
          );

        }
  // ======================================================
  // ★今回のQR処理は完了
  // ======================================================
    isFinished = true;

    alreadyProcessed = true;

 // ======================================================
    // ★【パターンB変更箇所】画面を完全にダミーHTMLへ書き換える
    // ======================================================
    document.open();
    document.write(`
      <!DOCTYPE html>
      <html>
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>完了</title>
        <style>
          body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            font-family: sans-serif;
            font-size: 48px;
            font-weight: bold;
            color: #222;
            text-align: center;
            line-height: 1.6;
            padding: 30px;
            box-sizing: border-box;
          }
          .sub-text {
            font-size: 32px;
            color: #666;
            font-weight: normal;
            margin-top: 30px;
          }
        </style>
      </head>
      <body>
        <div>
          <div>${msgText}</div>
          <div class="sub-text">この画面は終了しています。<br>タブを閉じて大丈夫です。</div>
        </div>
      </body>
      </html>
    `);
    document.close();

    // LINE内アプリであれば同時に閉じる処理を実行
    if (typeof liff !== 'undefined' && liff.isInClient()) {
      liff.closeWindow();
    }

  } catch (e) {
    console.error(e);
    const errMsg = "エラーが発生しました。\n" + e;
   
    isFinished = true;
    document.getElementById("message").innerHTML = `
      <span>${errMsg}</span>
      <div class="close-trigger" onclick="closeWindow()">✕ 閉じる</div>
    `;
  }
}

// ========================================================== 
// LIFF起動時に1回だけ実行 
// ==========================================================
//log("0: 処理開始");   

sendStamp();

</script>
</body>
</html>
