<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
 <!-- ◆ 内部にボタンを埋め込めるよう、spanタグで囲いました -->
  <div id="message"><span>処理中...</span></div>
  <style>
  #message {
    font-size: 56px;          /* 文字を大きく */
    font-weight: bold;        /* 太字 */
    color: #222;              /* 濃い文字色 */
    text-align: center;       /* 横中央 */

    display: flex;
    flex-direction: column;   /* ◆ メッセージと✕を縦に並べるために追加 */
    justify-content: center;  /* 横中央 */
    align-items: center;      /* 縦中央 */

    height: 100vh;            /* 画面全体の高さ */
    width: 100%;

    line-height: 1.5;
    padding: 20px;

    background-color: #f9f9f9; /* 背景色 */
    white-space: pre-line;     /* \n を改行として表示 */
    box-sizing: border-box;    /* ◆ パディングによる崩れ防止 */  
    }
    /* ◆ 追加した ✕ ボタン（テキスト風リンク）のスタイル */
    .close-trigger {
      display: inline-block;
      margin-top: 40px;
      font-size: 40px;
      color: #e03131;          /* 押しやすい赤色 */
      cursor: pointer;
      text-decoration: underline;
    }
   </style>

  <script>
　　// ========================================================== 
    // 二重送信防止 
    // ==========================================================
    let isProcessing = false;
    
    function log(msg) {
      document.getElementById("message").innerHTML = `<span>${msg}</span>`;
      console.log(msg);
    }
    // ◆ ボタンを押した時に実行される閉じる関数
    function closeWindow() {
      if (typeof liff !== 'undefined' && liff.isInClient()) {
        liff.closeWindow();
      } else {
        window.close();
      }
    }
    // ========================================================== 
    // 打刻処理 
    // ==========================================================
async function sendStamp() {
  
    if (isProcessing) { console.log("すでに処理中のため送信しません"); return; }
// 処理開始 
    isProcessing = true;
try { 
// liffIdセット
//log("1: liff.init開始");
//log(window.location.href);
  try {
  //if (window.parent !== window) {
  // iframeの中にいる場合、親ウィンドウのURLを確認する処理
  // GASの場合は回避が難しいことが多いため、
  // 以下の設定で初期化を試みる
  //}    
  await liff.init({ liffId: "2009820268-v3E9yC4f", withLoginOnExternalBrowser: true 
    });
  //log("2: liff.init成功");
} catch (err) {
//  console.log("LIFF INIT ERROR: " + JSON.stringify(err));
    isProcessing = false;
    document.getElementById("message").innerHTML = "<span>LIFFの初期化に失敗しました。</span>";
    return;
}
    
  if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    // 修正ポイント2: パラメータをURLからではなくLIFFコンテキストから取る
    // (LINE内ブラウザで開いている場合、こちらの方が確実です)
  
//log("3: profile取得成功");
  
    const context = liff.getContext();
    console.log("LIFF context:", context);
    const profile = await liff.getProfile();
// URLパラメータ取得    
    const params = new URLSearchParams(window.location.search);
    const action = params.get("action");
    const genbaCd = params.get("genba");
    const date = params.get("date");

 //log(`4: データ取得成功 (action:${action})`);

    document.getElementById("message").innerHTML = "<span>送信中...</span>";
//log("5: fetch開始");

 // エンドポイントURLを変更
     const response = await fetch("https://script.google.com/macros/s/AKfycbyQqdkxzv88kkfp3dQntI1hWOZVhh8HxIBxIr9v9IP6jeMijmDC-1YgpuIBHokNgJ0/exec", 
      { method: "POST",
      body: JSON.stringify({
        genbaCd: genbaCd,
        date: date,
        action: action,
        userId: profile.userId,
        displayName: profile.displayName
      })
    }
 );
//log("6: fetch成功");

  // ====================================================== 
  // GASからの結果取得 
  // ======================================================
    const result = await response.json();
    const msgText = result.message || "完了しました";
 // ◆【修正ポイント】自動終了の setTimeout を削除し、メッセージの下に「✕ 閉じる」を追加
  document.getElementById("message").innerHTML = `
      <span>${msgText}</span>
      <div class="close-trigger" onclick="closeWindow()">✕ 閉じる</div>
      `;       

      } catch (e) {
        console.error(e);
        const errMsg = "エラーが発生しました。\n" + e;
        "エラーが発生しました。\n" + e;  
     
    // ◆ エラー時も「✕ 閉じる」を表示
        document.getElementById("message").innerHTML = `
          <span>${errMsg}</span>
          <div class="close-trigger" onclick="closeWindow()">✕ 閉じる</div>
        `;
    // エラーの場合だけ再実行可能にする 
        isProcessing = false;
      }
    }
// ========================================================== 
// LIFF起動時に1回だけ実行 
// ==========================================================
//log("0: 処理開始");   

sendStamp();

</script>
</body>
</html>
