<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      margin: 0;
      background-color: #f9f9f9;
      font-family: sans-serif;
    }

    #message {
      font-size: 32px;
      font-weight: bold;
      color: #222;
      text-align: center;  

      display: flex;
      justify-content: center;
      align-items: center;

      height: 100vh;
      width: 100%;

      line-height: 1.5;
      padding: 20px;
      box-sizing: border-box;
    }
    /* メッセージ本文は左揃え */ 
    #message.result {
      flex-direction: column;
      text-align: left;
    }
    
/* ─── 【追加】文字をふわふわ点滅させるアニメーション ─── */
    .blink {
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 1.0; }
      100% { opacity: 0.3; }
    }

    /* ✕閉じるは改行して中央揃え */
    .close-trigger {
      display: block;
      margin-top: 30px;
      font-size: 24px;
      color: #e03131;
      cursor: pointer;
      text-decoration: underline;
      text-align: center; 
      width: 100%;
    }
  </style>
</head>

<body>

  <div id="message" class="blink">
    処理中...
  </div>

<script>

  // ==========================================================
  // 設定
  // ==========================================================

  const LIFF_ID = "2009820268-v3E9yC4f";

  const GAS_URL =
    "https://script.google.com/macros/s/AKfycbyQqdkxzv88kkfp3dQntI1hWOZVhh8HxIBxIr9v9IP6jeMijmDC-1YgpuIBHokNgJ0/exec";


  // ==========================================================
  // メッセージ表示
  // ==========================================================
  // 【変更】第3引数に isBlink (点滅させるかどうか) を追加
  function showMessage(message, showClose = false, isBlink = false) {

    const element = document.getElementById("message");
    element.classList.toggle("result", showClose);
    
    // 点滅クラスの付け外し
    if (isBlink) {
      element.classList.add("blink");
    } else {
      element.classList.remove("blink");
    }
    
    if (showClose) {

      element.innerHTML =
        "<div>" +
        message.replace(/\n/g, "<br>") +
        '<div class="close-trigger" onclick="closeWindow()">' +
        "✕ 閉じる" +
        "</div>" +
        "</div>";

    } else {

      element.textContent = message;

    }
  }
  
  // ==========================================================
  // 処理終了後
  // index.htmlを再利用せず、
  // パラメータを完全に破壊してから終了ページへ移動する
  // ==========================================================

  function goToEndPage(message) {
  // 1. まず現在のURLからパラメータ（?action=...）を履歴ごと消し去る
    if (window.history.replaceState) {
      window.history.replaceState(null, null, window.location.pathname);
    }
  // 2. その上で終了ページへ移動  
    window.location.replace("end.html?message=" + encodeURIComponent(message));
  }

  // ==========================================================
  // 打刻処理
  // ==========================================================

  async function sendStamp() {
    let congestionTimer = null; // 【追加】混雑表示用のタイマー保持変数
    
    try {

      // 最初にLIFFを初期化する
      // これにより、liff.state の中身が通常のURLパラメータに復元されます
      
      await liff.init({
        liffId: LIFF_ID,
        withLoginOnExternalBrowser: true
      });

      // ------------------------------------------------------
      // ログイン確認
      // ------------------------------------------------------
      if (!liff.isLoggedIn()) {

        liff.login();

        return;
      }

      
      // ------------------------------------------------------
      // URLパラメータ取得
      // ------------------------------------------------------

      const params =
        new URLSearchParams(window.location.search);

      const action =
        params.get("action");

      const genbaCd =
        params.get("genba");

      const date =
        params.get("date");


      // ------------------------------------------------------
      // パラメータチェック
      // ------------------------------------------------------

      if (
        !action ||
        !genbaCd ||
        !date
      ) {

        showMessage(
          "パラメーターの取得ができませんでした。",
          true,false
        );

        return;
      }     

      // ------------------------------------------------------
      // LINEプロフィール取得
      // ------------------------------------------------------

      const profile =
        await liff.getProfile();


      // ------------------------------------------------------
      // 送信中表示
      // ------------------------------------------------------
      // 【変更】点滅を有効(true)にして「送信中...」を表示
      showMessage("送信中...", false, true);

      // ─── 【追加】もしGASからの返答が3秒以上かかった場合の処理 ───
      // 前の人が打刻中でロック待ちになっている場合、3秒後にメッセージを切り替えます
      congestionTimer = setTimeout(() => {
        showMessage("ただいま混雑しています。\nそのまましばらくお待ちください...", false, true);
      }, 3000); // 3000ミリ秒 = 3秒

      // ------------------------------------------------------
      // GASへ送信
      // ------------------------------------------------------

      const response =
        await fetch(
          GAS_URL,
          {
            method: "POST",

            body: JSON.stringify({

              genbaCd: genbaCd,

              date: date,

              action: action,

              userId: profile.userId,

              displayName: profile.displayName

            })
          }
        );
      // ─── 【強化】GASから応答が戻った瞬間に、最優先でタイマーを完全に破壊する ───
      if (congestionTimer) {
        clearTimeout(congestionTimer);
        congestionTimer = null; 
      }

      // ------------------------------------------------------
      // GASから結果取得
      // ------------------------------------------------------

      const responseText = await response.text();

      let result;

      try {
          result = JSON.parse(responseText);
      } catch (error) {
          console.error("GAS応答がJSONではありません:", responseText);

          showMessage(
            "通信結果を確認できませんでした。\nもう一度ＱＲコードを読んでください。\n出勤処理済みとなった場合は処理が完了してます。",
          true,false
      );

       return;
      }
       // 「終了専用ページ」へ移動
      goToEndPage(result.message || "処理が完了しました。");     

    } catch (error) {
      // ─── 【追加】エラー発生時もタイマーが動いていれば解除 ───
      if (congestionTimer) {
        clearTimeout(congestionTimer);
      }
      // ───────────────────────────────
      console.error(error);

      showMessage(
        "エラーが発生しました。\nもう一度ＱＲコードを読んでください。\n出勤処理済みとなった場合は処理が完了してます。" ,
        true,false
      );

    }

  }


  // ==========================================================
  // ページ起動時に1回だけ実行
  // ==========================================================

  sendStamp();

</script>

</body>
</html>
