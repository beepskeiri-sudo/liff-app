<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      margin: 0;
      background-color: #f9f9f9;
    }

    #message {
      font-size: 56px;
      font-weight: bold;
      color: #222;
      text-align: center;

      display: flex;
      justify-content: center;
      align-items: center;

      height: 100vh;
      width: 100%;

      line-height: 1.5;
      padding: 20px;
      box-sizing: border-box;
    }

    .close-trigger {
      display: inline-block;
      margin-top: 40px;
      font-size: 40px;
      color: #e03131;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div id="message">
    処理中...
  </div>


<script>

  // ==========================================================
  // 設定
  // ==========================================================

  const LIFF_ID = "2009820268-v3E9yC4f";

  const GAS_URL =
    "https://script.google.com/macros/s/AKfycbyQqdkxzv88kkfp3dQntI1hWOZVhh8HxIBxIr9v9IP6jeMijmDC-1YgpuIBHokNgJ0/exec";


  // ==========================================================
  // メッセージ表示
  // ==========================================================

  function showMessage(message, showClose = false) {

    const element = document.getElementById("message");

    if (showClose) {

      element.innerHTML =
        "<div>" +
        message.replace(/\n/g, "<br>") +
        '<div class="close-trigger" onclick="closeWindow()">' +
        "✕ 閉じる" +
        "</div>" +
        "</div>";

    } else {

      element.textContent = message;

    }
  }


  // ==========================================================
  // LIFFを閉じる
  // ==========================================================

  function closeWindow() {

    if (
      typeof liff !== "undefined" &&
      liff.isInClient()
    ) {

      liff.closeWindow();

    } else {

      window.close();

    }
  }


  // ==========================================================
  // 処理終了後
  //
  // index.htmlを再利用せず、
  // 完全に「終了ページ」へ移動する
  // ==========================================================

  function goToEndPage(message) {

    const endUrl =
      GAS_URL +
      "?page=end&message=" +
      encodeURIComponent(message);

    window.location.replace(endUrl);
  }


  // ==========================================================
  // 打刻処理
  // ==========================================================

  async function sendStamp() {

    try {

      // ------------------------------------------------------
      // URLパラメータ取得
      // ------------------------------------------------------

      const params =
        new URLSearchParams(window.location.search);

      const action =
        params.get("action");

      const genbaCd =
        params.get("genba");

      const date =
        params.get("date");


      // ------------------------------------------------------
      // パラメータチェック
      // ------------------------------------------------------

      if (
        !action ||
        !genbaCd ||
        !date
      ) {

        showMessage(
          "打刻情報がありません。",
          true
        );

        return;
      }


      // ------------------------------------------------------
      // LIFF初期化
      // ------------------------------------------------------

      await liff.init({
        liffId: LIFF_ID,
        withLoginOnExternalBrowser: true
      });


      // ------------------------------------------------------
      // ログイン確認
      // ------------------------------------------------------

      if (!liff.isLoggedIn()) {

        liff.login();

        return;
      }


      // ------------------------------------------------------
      // LINEプロフィール取得
      // ------------------------------------------------------

      const profile =
        await liff.getProfile();


      // ------------------------------------------------------
      // 送信中表示
      // ------------------------------------------------------

      showMessage("送信中...");


      // ------------------------------------------------------
      // GASへ送信
      // ------------------------------------------------------

      const response =
        await fetch(
          GAS_URL,
          {
            method: "POST",

            body: JSON.stringify({

              genbaCd: genbaCd,

              date: date,

              action: action,

              userId: profile.userId,

              displayName: profile.displayName

            })
          }
        );


      // ------------------------------------------------------
      // GASから結果取得
      // ------------------------------------------------------

      const result =
        await response.json();


      const message =
        result.message ||
        "処理が完了しました。";


      // ------------------------------------------------------
      // ★重要
      //
      // index.htmlにはもう戻らない
      //
      // 「終了専用ページ」へ移動
      // ------------------------------------------------------

      goToEndPage(message);


    } catch (error) {

      console.error(error);

      showMessage(
        "エラーが発生しました。\n" +
        error,
        true
      );

    }

  }


  // ==========================================================
  // ページ起動時に1回だけ実行
  // ==========================================================

  sendStamp();

</script>

</body>
</html>
