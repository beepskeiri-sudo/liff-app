<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <!-- 必ずLIFFのSDKを読み込ませます -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <title>処理終了</title>

  <style>

    body {
      margin: 0;

      height: 100vh;

      background-color: #f9f9f9;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: sans-serif;

      text-align: center;

      color: #222;
    }

    .message {
      font-size: 48px;
      font-weight: bold;
      line-height: 1.6;

      padding: 30px;
      box-sizing: border-box;
    }

    .sub {
      margin-top: 30px;

      font-size: 28px;
      font-weight: normal;

      color: #666;
    }

  </style>

</head>

<body>

  <div class="message">

    <div id="message">
      処理は終了しました。
    </div>

    <div class="sub">
      この画面は終了しています。<br>
      タブを閉じてください。
    </div>

  </div>


<script>
  const LIFF_ID = "2009820268-v3E9yC4f";

  // LINEのキャッシュ対策：すでに一度表示されたかをセッションに記録
  // これが「true」ということは、裏で眠っていたタブが叩き起こされた証拠
  if (sessionStorage.getItem("is_liff_ended")) {
    // 叩き起こされた瞬間に、何もせずLINEを強制的に閉じる
    alert("画面を閉じます"); // 必要に応じて残すか、消してもOK
    closeAppImmediate();
  } else {
    // 初回起動時のみ、フラグを立てる
    sessionStorage.setItem("is_liff_ended", "true");
  }
  
  // ==========================================================
  // 1. 超重要：履歴からの再起動・2重動作を防ぐ処理（定義と実行）
  // ==========================================================
  async function cleanAndInit() {
    try {
      // 先にメッセージを画面に表示（URLが書き換わる前に取得するため）
      const params = new URLSearchParams(window.location.search);
      const message = params.get("message");
      if (message) {
        document.getElementById("message").textContent = message;
      }

      // 終了画面でもLIFFを初期化する
      await liff.init({ liffId: LIFF_ID });

      // ★初期化完了後、即座にURL履歴から「?message=...」を完全に消去して上書きする
      if (window.history.replaceState) {
        window.history.replaceState(null, null, window.location.pathname);
      }
    } catch (error) {
      console.error("LIFFの初期化に失敗しました", error);
    }
  }

   // 即時クローズ用
  function closeAppImmediate() {
    // LIFF SDKが読み込まれるのを待たずに閉じに行く
    if (typeof liff !== "undefined" && liff.closeWindow) {
      liff.closeWindow();
    } else {
      window.close();
    }
  }
  
  // ==========================================================
  // 2. 自作ボタン用（もし画面に閉じるボタンを配置したくなったら使えます）
  // ==========================================================
  function closeApp() {
    if (typeof liff !== "undefined" && liff.isInClient()) {
      liff.closeWindow();
    } else {
      window.close();
    }
  }

  // ==========================================================
  // 3. 画面が開いた瞬間に実行する
  // ==========================================================
  cleanAndInit();
  
</script>
</body>
</html>
