<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>処理終了</title>

  <style>

    body {
      margin: 0;

      height: 100vh;

      background-color: #f9f9f9;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: sans-serif;

      text-align: center;

      color: #222;
    }

    .message {
      font-size: 48px;
      font-weight: bold;
      line-height: 1.6;

      padding: 30px;
      box-sizing: border-box;
    }

    .sub {
      margin-top: 30px;

      font-size: 28px;
      font-weight: normal;

      color: #666;
    }

  </style>

</head>

<body>

  <div class="message">

    <div id="message">
      処理は終了しました。
    </div>

    <div class="sub">
      この画面は終了しています。<br>
      タブを閉じて大丈夫です。
    </div>

  </div>


<script>

  // ==========================================================
  // URLからGASが渡したメッセージを表示
  // ==========================================================

  const params =
    new URLSearchParams(
      window.location.search
    );

  const message =
    params.get("message");

  if (message) {

    document.getElementById("message")
      .textContent = message;

  }

</script>

</body>
</html>
